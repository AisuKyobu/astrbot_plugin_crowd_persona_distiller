<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>群友蒸馏师 - 管理面板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>群友蒸馏师</h1>
      <nav class="tabs">
        <button class="tab active" data-tab="personas"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>群友列表</button>
        <button class="tab" data-tab="nicknames"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>称呼管理</button>
        <button class="tab" data-tab="config"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>群配置</button>
        <button class="tab" data-tab="import"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>数据导入</button>
      </nav>
    </header>

    <main class="main">
      <!-- 群友列表 -->
      <section id="tab-personas" class="tab-content active">
        <div class="toolbar">
          <select id="group-filter" class="select">
            <option value="">-- 请选择群 --</option>
          </select>
          <div class="toolbar-search">
            <svg class="icon icon-sm icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="persona-search" class="input" placeholder="搜索:名字 / 别名 / QQ号" disabled />
          </div>
          <select id="persona-sort" class="select select-sm" disabled>
            <option value="msg_desc">消息数 ↓</option>
            <option value="msg_asc">消息数 ↑</option>
            <option value="last_desc">最近发言 ↓</option>
            <option value="last_asc">最近发言 ↑</option>
            <option value="status">蒸馏状态</option>
          </select>
          <span id="status-text" class="status"></span>
        </div>
        <div id="stats-bar" class="stats-bar" style="display:none">
          <div class="stat stat-distilled"><span class="stat-num" id="stat-distilled">0</span><span class="stat-label">已蒸馏</span></div>
          <div class="stat stat-pending"><span class="stat-num" id="stat-pending">0</span><span class="stat-label">可蒸馏</span></div>
          <div class="stat stat-notready"><span class="stat-num" id="stat-notready">0</span><span class="stat-label">未达标</span></div>
          <div class="stat stat-total"><span class="stat-num" id="stat-total">0</span><span class="stat-label">合计</span></div>
        </div>
        <div id="persona-list" class="card-list">
          <div class="empty-illustration">
            <div class="empty-title">请先选择一个群</div>
            <div class="empty-hint">选择群后将显示该群的群友列表、蒸馏状态和消息数</div>
          </div>
        </div>
      </section>

      <!-- 称呼管理 -->
      <section id="tab-nicknames" class="tab-content">
        <div class="toolbar">
          <button id="btn-nickname-add" class="btn btn-primary">+ 添加称呼</button>
          <div class="toolbar-search">
            <svg class="icon icon-sm icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="nickname-search" class="input" placeholder="搜索:QQ号 / 称呼" />
          </div>
          <span id="nickname-status" class="status"></span>
        </div>
        <table id="nickname-table" class="data-table">
          <thead>
            <tr><th>QQ号</th><th>称呼</th><th>操作</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="3" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </section>

      <!-- 群配置 -->
      <section id="tab-config" class="tab-content">
        <div class="config-section">
          <div class="form-row">
            <label class="label">选择群</label>
            <select id="config-group-select" class="select">
              <option value="">-- 选择群 --</option>
            </select>
          </div>
          <div class="form-row">
            <label class="label">扮演模式</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="reply_mode" value="random" checked> 随机群友</label>
              <label class="radio-label"><input type="radio" name="reply_mode" value="specific"> 指定群友</label>
              <label class="radio-label"><input type="radio" name="reply_mode" value="disabled"> 关闭扮演</label>
            </div>
          </div>
          <div class="form-row" id="specific-persona-row" style="display:none">
            <label class="label">指定群友</label>
            <select id="specific-persona-select" class="select">
              <option value="">-- 选择群友 --</option>
            </select>
          </div>
          <div class="form-row">
            <label class="label">@机器人触发</label>
            <label class="toggle-label">
              <input type="checkbox" id="at-trigger-toggle" checked>
              <span class="toggle-text">开启（群友 @Bot 时扮演回复）</span>
            </label>
          </div>
          <div class="form-row">
            <label class="label">扮演时改群名片</label>
            <label class="toggle-label">
              <input type="checkbox" id="name-change-toggle" checked>
              <span class="toggle-text">扮演时将 Bot 群名片改为该群友称呼</span>
            </label>
          </div>
          <div class="form-row">
            <button id="btn-save-config" class="btn btn-save">保存配置</button>
            <span id="config-status" class="status"></span>
          </div>
        </div>
      </section>

      <!-- 数据导入 -->
      <section id="tab-import" class="tab-content">
        <div class="import-section">
          <h3>上传 QQ 聊天记录 (JSON)</h3>
          <p class="hint">支持 <a href="https://github.com/shuakami/qq-chat-exporter" target="_blank">qq-chat-exporter</a> 导出的群聊和私聊 JSON</p>
          <div class="import-form">
            <div class="form-row">
              <label class="label">聊天类型</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="chat_type" value="group" checked> 群聊</label>
                <label class="radio-label"><input type="radio" name="chat_type" value="private"> 私聊</label>
              </div>
            </div>
            <label class="label">群号 / 对方 QQ（自动提取）</label>
            <input type="text" id="import-group-id" class="input readonly-input" readonly placeholder="上传文件后自动填充" />
            <label class="label">聊天记录文件 (.json)</label>
            <input type="file" id="import-file" class="input" accept=".json" />
            <div class="import-actions">
              <button id="btn-import-preview" class="btn btn-primary">预览</button>
              <button id="btn-import-confirm" class="btn btn-save" disabled>确认导入</button>
            </div>
            <div id="import-preview" class="import-preview">
              <div class="empty-illustration">
                <div class="empty-title">选择文件并填写信息后预览</div>
                <div class="empty-hint">支持 qq-chat-exporter v5.x 导出的群聊 / 私聊 JSON</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Persona 弹窗 -->
    <div id="persona-modal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-body">
          <textarea id="modal-editor" class="editor" placeholder="加载 persona.md 内容..."></textarea>
        </div>
        <div id="modal-status-bar" class="modal-status-bar" style="display:none">
          <div class="modal-status-content">
            <span id="modal-status" class="status"></span>
            <button id="modal-status-dismiss" class="btn btn-link">知道了</button>
          </div>
        </div>
        <div class="modal-footer modal-footer-split">
          <div class="modal-footer-group modal-footer-main">
            <button id="modal-save" class="btn btn-save">保存</button>
            <button id="modal-redistill" class="btn btn-primary">重新蒸馏</button>
            <button id="modal-incremental" class="btn btn-primary">增量更新</button>
            <button id="modal-correct" class="btn btn-primary">修正人格</button>
          </div>
          <div class="modal-footer-group modal-footer-danger">
            <button id="modal-delete" class="btn btn-danger">删除此人格</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 称呼弹窗 -->
    <div id="nickname-modal" class="modal-overlay" style="display:none">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2 id="nickname-modal-title">添加称呼</h2>
          <button class="modal-close" id="nickname-modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label class="label">QQ号</label>
            <input type="text" id="nickname-modal-uid" class="input" placeholder="例如: 2854208913" />
          </div>
          <div class="form-row">
            <label class="label">称呼</label>
            <input type="text" id="nickname-modal-name" class="input" placeholder="半角逗号分隔，如: 基长,基宝,长哥" />
            <span class="hint">用半角逗号（,）分隔多个别名，第一个为主称呼。注意不要用中文逗号（，）</span>
          </div>
        </div>
        <div class="modal-footer">
          <button id="nickname-modal-save" class="btn btn-save">保存</button>
          <button id="nickname-modal-cancel" class="btn">取消</button>
          <span id="nickname-modal-status" class="status"></span>
        </div>
      </div>
    </div>

    <!-- 修正弹窗 -->
    <div id="correct-modal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <h2 id="correct-modal-title">修正人格</h2>
          <button class="modal-close" id="correct-modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <p class="correct-hint">LLM 会读取当前 persona.md，根据你的反馈输出修正后的完整人格。修正后会自动保存。</p>
          <div class="form-row">
            <textarea id="correct-modal-text" class="editor" rows="8" placeholder="描述你觉得当前人格哪里不对…
例如：
- 他不会主动找人聊天，现在的描述太主动了
- 他说话语气更随意，不应该那么正式
- 他对游戏话题其实兴趣不大，应该降低权重
- 他从不发早安晚安，人格里写错了"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="correct-modal-submit" class="btn btn-save">提交修正</button>
          <button id="correct-modal-cancel" class="btn">取消</button>
          <span id="correct-modal-status" class="status"></span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
